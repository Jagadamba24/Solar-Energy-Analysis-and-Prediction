services:
  - type: web
    name: solar-energy-prediction
    env: python
    buildCommand: pip install -r requirements.txt && python train_and_evaluate.py
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.14
